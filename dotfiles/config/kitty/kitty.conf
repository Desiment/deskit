# Migrated from ~/.config/alacritty/alacritty.toml.

font_family postscript_name=JetBrainsMonoNF-Medium
bold_font postscript_name=JetBrainsMonoNF-SemiBold
italic_font postscript_name=JetBrainsMonoNF-MediumItalic
bold_italic_font postscript_name=JetBrainsMonoNF-SemiBoldItalic
font_size 10.0

env LC_CTYPE=en_US.UTF-8

# The window size is rarely an exact multiple of the cell size, so kitty adds
# thin padding strips at the edges of the cell area. Colored with the terminal
# background they show up as a frame around full screen TUIs that paint their
# own background. Coloring them like the neighbouring cell makes them blend
# into the application instead.
padding_fill_strategy neighboring_cell

# Alternatives, in case the strips should not follow the app background:
# placement_strategy top-left
# initial_window_width 120c
# initial_window_height 40c
# remember_window_size no

include themes/solarized-light.conf
