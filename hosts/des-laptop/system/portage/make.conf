# make.conf
COMMON_FLAGS="-O2 -march=native"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"

### Using clang system-wide
CC="clang"
CPP="clang-cpp" # necessary for xorg-server and possibly other packages
CXX="clang++"
AR="llvm-ar"
NM="llvm-nm"
RANLIB="llvm-ranlib"

### Using amd64 notepad with intel graphics
ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"
VIDEO_CARDS="intel"

### Options for building
USE="-X -kde -plasma -gnome -gnome-keyring -opengl -cairo -dga -handbook wayland aac alsa jack ao audiofile avif -coreaudio cups djvu dts dv dvb encode ffmpeg flac ggi gif gsm imagemagick imlib jpeg mp3 mp4 mpeg opus pdf png postscript svg fontconfig truetype ttf otf unicode nls asm blas cxx dbi dbm dbus fam fortran gdbm git gnuplot gsl hscolour jit lapack lcms lua perl python bluetooth lm-sensors pda screencast sound threads uefi usb wifi -aqua -apparmor -clamav -colord -geoip aalib curl ftp man ncurses policykit -systemd -telemetry zsh-completion"
MAKEOPTS="-j6 -l6"
EMERGE_DEFAULT_OPTS="--jobs 6"

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LINGUAS="en"
L10N="en ru en-US"
LC_MESSAGES=C.utf8

PYTHON_TARGETS="python3_13 python3_14"

# Portage
PORTAGE_LOGDIR="/var/log/portage"
PORTAGE_ELOG_CLASSES="warn error"
PORTAGE_ELOG_SYSTEM="echo save"
